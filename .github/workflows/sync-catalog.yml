name: Sync Catalog

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Ejecutar sync full por fases"
        required: false
        default: true
        type: boolean
      concurrency:
        description: "Concurrencia base para scraping"
        required: false
        default: "8"
        type: string
  schedule:
    # 08:00 UTC = 04:00 America/Asuncion
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  full_chunks:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full == true)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chunk:
          - { id: 1, start: 0, end: 5000 }
          - { id: 2, start: 5000, end: 10000 }
          - { id: 3, start: 10000, end: 15000 }
          - { id: 4, start: 15000, end: 20000 }
          - { id: 5, start: 20000, end: 25000 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run chunk sync with retries
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          BASE_CONCURRENCY="8"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE_CONCURRENCY="${{ inputs.concurrency }}"
          fi

          if ! [[ "$BASE_CONCURRENCY" =~ ^[0-9]+$ ]]; then
            BASE_CONCURRENCY="8"
          fi

          if [ "$BASE_CONCURRENCY" -le 0 ]; then
            BASE_CONCURRENCY="8"
          fi

          CHUNK_OUT="artifacts/chunk-${{ matrix.chunk.id }}.json"
          API_RESET_EVERY="200"

          run_chunk () {
            npm run sync:chunk -- \
              --start "${{ matrix.chunk.start }}" \
              --end "${{ matrix.chunk.end }}" \
              --concurrency "$1" \
              --api-reset-every "$API_RESET_EVERY" \
              --output "$CHUNK_OUT"
          }

          echo "Chunk ${{ matrix.chunk.id }} | range=${{ matrix.chunk.start }}-${{ matrix.chunk.end }} | concurrency=$BASE_CONCURRENCY"

          if ! run_chunk "$BASE_CONCURRENCY"; then
            echo "Primer intento fallido en chunk ${{ matrix.chunk.id }}. Reintentando..."
            RETRY_1=6
            if [ "$BASE_CONCURRENCY" -lt "$RETRY_1" ]; then
              RETRY_1="$BASE_CONCURRENCY"
            fi

            if ! run_chunk "$RETRY_1"; then
              echo "Segundo intento fallido en chunk ${{ matrix.chunk.id }}. Ultimo intento..."
              RETRY_2=4
              if [ "$RETRY_1" -lt "$RETRY_2" ]; then
                RETRY_2="$RETRY_1"
              fi
              run_chunk "$RETRY_2"
            fi
          fi

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.id }}
          path: artifacts/chunk-${{ matrix.chunk.id }}.json
          if-no-files-found: error
          retention-days: 3

  merge_full:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full == true)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: full_chunks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download chunk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: artifacts/chunks
          merge-multiple: true

      - name: Merge chunks into data snapshot
        run: npm run sync:merge -- --input-dir artifacts/chunks --output data/products.json

      - name: Build seed snapshot
        run: npm run seed:build

      - name: Commit and push seed changes
        run: |
          if git diff --quiet -- seed/products.json; then
            echo "Sin cambios en seed/products.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed/products.json
          git commit -m "chore: update seed catalog snapshot"
          git push

  incremental_manual:
    if: github.event_name == 'workflow_dispatch' && inputs.full != true
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare baseline snapshot
        run: |
          if [ ! -f seed/products.json ]; then
            echo "ERROR: seed/products.json no existe" >&2
            exit 1
          fi
          mkdir -p data
          cp seed/products.json data/products.json

      - name: Run incremental sync
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          CONCURRENCY="${{ inputs.concurrency }}"
          if ! [[ "$CONCURRENCY" =~ ^[0-9]+$ ]]; then
            CONCURRENCY="8"
          fi
          if [ "$CONCURRENCY" -le 0 ]; then
            CONCURRENCY="8"
          fi
          npm run sync -- --concurrency "$CONCURRENCY" --api-reset-every 250

      - name: Build seed snapshot
        run: npm run seed:build

      - name: Commit and push seed changes
        run: |
          if git diff --quiet -- seed/products.json; then
            echo "Sin cambios en seed/products.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed/products.json
          git commit -m "chore: update seed catalog snapshot"
          git push
