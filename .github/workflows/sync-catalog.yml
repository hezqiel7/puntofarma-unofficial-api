name: Sync Catalog

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Ejecutar sync full"
        required: false
        default: false
        type: boolean
      concurrency:
        description: "Concurrencia para scraper"
        required: false
        default: "20"
        type: string
  schedule:
    # 08:00 UTC = 04:00 America/Asuncion
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare baseline snapshot
        run: |
          mkdir -p data
          if [ -f seed/products.json ]; then
            cp seed/products.json data/products.json
            echo "Snapshot seed copiado a data/products.json"
          fi

      - name: Run sync
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          CONCURRENCY="16"
          FULL_FLAG=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CONCURRENCY="${{ inputs.concurrency }}"
            if [ "${{ inputs.full }}" = "true" ]; then
              FULL_FLAG="--full"
            fi
          fi

          if ! [[ "$CONCURRENCY" =~ ^[0-9]+$ ]]; then
            CONCURRENCY="16"
          fi

          if [ "$CONCURRENCY" -le 0 ]; then
            CONCURRENCY="16"
          fi

          run_sync () {
            npm run sync -- $FULL_FLAG --concurrency "$1"
          }

          echo "Ejecutando sync con concurrency=$CONCURRENCY full=${FULL_FLAG:-false}"

          if ! run_sync "$CONCURRENCY"; then
            echo "Primer intento fallido. Reintentando con concurrencia mas baja..."
            RETRY_CONCURRENCY=10
            if [ "$CONCURRENCY" -lt "$RETRY_CONCURRENCY" ]; then
              RETRY_CONCURRENCY="$CONCURRENCY"
            fi
            run_sync "$RETRY_CONCURRENCY"
          fi

      - name: Build seed snapshot
        run: npm run seed:build

      - name: Commit and push seed changes
        run: |
          if git diff --quiet -- seed/products.json; then
            echo "Sin cambios en seed/products.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed/products.json
          git commit -m "chore: update seed catalog snapshot"
          git push
